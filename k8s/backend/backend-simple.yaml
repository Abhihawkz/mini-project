apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mini-project
spec:
  selector:
    app: backend
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mini-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: nginx:alpine
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: MONGO_URI
          value: "mongodb://mongodb:27017/ai-app"
        command: ["sh", "-c", "echo 'Backend API running on port 4000' && nginx -g 'daemon off;'"]