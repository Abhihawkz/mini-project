apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mini-project
spec:
  selector:
    app: backend
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mini-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: node:20-alpine
        command: ["sh", "-c", "npm install && npm start"]
        workingDir: /app
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: MONGO_URI
          value: "mongodb://mongodb:27017/ai-app"
        - name: ACCESS_TOKEN_SECRET
          value: "replace_with_strong_random_secret"
        - name: REFRESH_TOKEN_SECRET
          value: "replace_with_another_secret"
        - name: ACCESS_TOKEN_EXPIRES_IN
          value: "15m"
        - name: REFRESH_TOKEN_EXPIRES_IN
          value: "7d"
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10